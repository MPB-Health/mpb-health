<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Hub</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel">
      <div class="brand">
        <span class="mark" aria-hidden="true">MPB</span>
        <div>
          <h1 class="title">Staff Hub</h1>
          <p class="sub">Healthshare ops desk</p>
        </div>
      </div>

      <p class="copy">
        Opens the live Staff Hub site. Clock-in, portals, and time off stay in one place.
      </p>

      <nav class="actions" aria-label="Staff Hub links">
        <a class="btn primary" href="https://staff.mpb.health/" target="_blank" rel="noopener noreferrer">
          Open Staff Hub
        </a>
        <a class="btn" href="https://staff.mpb.health/attendance" target="_blank" rel="noopener noreferrer">
          Attendance
        </a>
        <a class="btn" href="https://staff.mpb.health/time-off" target="_blank" rel="noopener noreferrer">
          Time Off
        </a>
        <a class="btn" href="https://portal.mpb.health/" target="_blank" rel="noopener noreferrer">
          Portal hostname
        </a>
      </nav>

      <p class="note">
        Full app opens in a browser tab so geolocation punches and auth keep working.
      </p>
    </main>
  </body>
</html>
