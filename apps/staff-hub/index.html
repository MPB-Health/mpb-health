<!doctype html>
<html lang="en" class="light">
  <head>
    <script>(function(){var t=localStorage.getItem('mpb-theme');var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;var dark=t==='dark'||((t==='system'||!t)&&prefersDark);if(dark){document.documentElement.classList.replace('light','dark')}})();</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A4E8E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E2D41" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=ibm-plex-mono:400,500|plus-jakarta-sans:400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <title>MPB Health - Staff Hub</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
