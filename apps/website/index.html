    <!-- ──────────────────────────────────────────────────────────────────
         Default page metadata (homepage / SPA fallback).

         Per-route metadata is generated at BUILD time by
         apps/website/scripts/prerender-seo.mjs, which writes
         dist/<route>/index.html for every entry in src/lib/page-seo-data.json.

         Vercel's static-file matching serves dist/<route>/index.html before
         the SPA-fallback rewrite, so crawlers and social cards see correct
         per-route metadata. JS-enabled visitors hydrate and react-helmet-async
         re-syncs the head from the React tree.

         To edit homepage SEO: change the "/" entry in page-seo-data.json AND
         keep the tags below in sync (the prerender script also rewrites
         dist/index.html from the JSON to guarantee they stay aligned).
         ────────────────────────────────────────────────────────────────── -->
    <title>Affordable HealthShare Memberships | MPB Health</title>
    <meta name="description" content="MPB Health offers flexible, affordable HealthShare memberships for individuals and families. Save on healthcare costs with our community-driven solutions." />
    <link rel="canonical" href="https://mpb.health/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="MPB Health" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mpb.health/" />
    <meta property="og:title" content="Affordable HealthShare Memberships | MPB Health" />
    <meta property="og:description" content="MPB Health offers flexible, affordable HealthShare memberships for individuals and families. Save on healthcare costs with our community-driven solutions." />
    <meta property="og:image" content="https://mpb.health/assets/MPB-Health-No-background.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:image" content="https://mpb.health/assets/MPB-Health-No-background.png?v=2" />

    <!-- ──────────────────────────────────────────────────────────────────
         Site-wide JSON-LD structured data (Sprint 2 — GEO / Local SEO)

         These three nodes are referenced by @id so Google can merge them
         into a single knowledge graph:
           • Organization      — corporate identity
           • MedicalOrganization+LocalBusiness — Local SEO + medical category
           • WebSite           — sitelinks

         Kept STATIC (not in Helmet) so non-JS SEO crawlers see them. The
         per-page Article/FAQ/HowTo schemas remain in their pages' Helmet
         blocks via lib/schemaMarkup.ts. The single source of truth for
         these schemas is apps/website/src/lib/schemaMarkup.ts — keep this
         block in sync when editing those functions.
         ────────────────────────────────────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://mpb.health/#organization",
      "name": "MPB Health",
      "url": "https://mpb.health/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://mpb.health/assets/MPB-Health-No-background.png?v=2",
        "width": 400,
        "height": 100
      },
      "description": "MPB Health offers affordable HealthShare memberships for individuals, families, and businesses. Not insurance — a smarter, more affordable alternative with transparent pricing and no network restrictions.",
      "foundingDate": "2011",
      "slogan": "Not Insurance — The Smarter, More Affordable Way to Pay for Healthcare Costs",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "5301 N Federal Hwy, Suite 155",
        "addressLocality": "Boca Raton",
        "addressRegion": "FL",
        "postalCode": "33487",
        "addressCountry": "US"
      },
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+1-855-816-4650",
          "contactType": "Customer Service",
          "areaServed": "US",
          "availableLanguage": ["English", "Spanish"],
          "contactOption": ["TollFree"]
        },
        {
          "@type": "ContactPoint",
          "telephone": "+1-855-816-4650",
          "contactType": "Sales",
          "areaServed": "US",
          "availableLanguage": ["English", "Spanish"],
          "contactOption": ["TollFree"]
        }
      ],
      "sameAs": [
        "https://www.facebook.com/mpbhealth",
        "https://twitter.com/mpbhealth",
        "https://www.linkedin.com/company/mpb-health",
        "https://www.youtube.com/@mpbhealth"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["MedicalOrganization", "LocalBusiness"],
      "@id": "https://mpb.health/#localbusiness",
      "name": "MPB Health",
      "description": "MPB Health offers flexible, affordable HealthShare memberships for individuals, families, and businesses across the United States — a community-driven alternative to traditional health insurance.",
      "url": "https://mpb.health/",
      "telephone": "+1-855-816-4650",
